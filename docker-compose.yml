services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    image: ionic-dev:1.1
    container_name: gestsis-mobile
    restart: unless-stopped
    tty: true
    working_dir: /app
    ports:
      - 8100:8100
    volumes:
      - .:/app
      - /app/node_modules
      - pnpm-cache:/pnpm-store
    command: sh -c "pnpm install --store-dir /pnpm-store && ionic serve --port=8100"

volumes:
  pnpm-cache:
    name: pnpm-store
    external: true
